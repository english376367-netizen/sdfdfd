let mc=[],ti=[],mi=0,ii=0,ms=0,is=0,locked=false,current=null;
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function speak(text){if(!window.speechSynthesis)return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='en-GB';u.rate=.84;speechSynthesis.speak(u)}
function switchMode(n){['e1','e2','r1','r2'].forEach(id=>document.getElementById(id).classList.add('hidden'));document.getElementById(n===1?'e1':'e2').classList.remove('hidden');document.getElementById('t1').classList.toggle('active',n===1);document.getElementById('t2').classList.toggle('active',n===2)}
function restart(n){if(n===1){mc=shuffle(WORDS);mi=0;ms=0;document.getElementById('r1').classList.add('hidden');renderMC()}else{ti=shuffle(WORDS);ii=0;is=0;document.getElementById('r2').classList.add('hidden');renderType()}switchMode(n)}
function renderMC(){locked=false;let w=mc[mi];document.getElementById('c1').textContent=`Question ${mi+1} / ${mc.length}`;document.getElementById('s1').textContent=`Score: ${ms}`;document.getElementById('b1').style.width=(mi/mc.length*100)+'%';document.getElementById('q1').textContent=`Which picture shows: ${w.word}?`;document.getElementById('f1').className='feedback hidden';let next=document.getElementById('n1');next.disabled=true;next.textContent=mi===mc.length-1?'See result':'Next';
let opts=shuffle([w,...shuffle(WORDS.filter(x=>x!==w)).slice(0,2)]),box=document.getElementById('choices');box.innerHTML='';
opts.forEach(x=>{let btn=document.createElement('button');btn.className='choice';let im=document.createElement('img');im.src=x.img;im.alt='';let meaning=document.createElement('span');meaning.className='meaning';meaning.textContent=x.vi;btn.append(im,meaning);btn.onclick=()=>{speak(x.word);if(locked)return;locked=true;let ok=x===w;if(ok)ms++;[...box.children].forEach((el,k)=>{el.disabled=true;if(opts[k]===w)el.classList.add('correct')});if(!ok)btn.classList.add('wrong');let f=document.getElementById('f1');f.textContent=ok?'Correct! Well done.':`Incorrect. The correct answer is: ${w.word}.`;f.className='feedback '+(ok?'good':'bad');document.getElementById('s1').textContent=`Score: ${ms}`;next.disabled=false};box.appendChild(btn)})}
function nextMC(){if(!locked)return;mi++;if(mi===mc.length){document.getElementById('e1').classList.add('hidden');document.getElementById('r1').classList.remove('hidden');document.getElementById('scoreFinal1').textContent=`${ms} / ${mc.length}`;document.getElementById('msg1').textContent=ms===mc.length?'Excellent work!':'Good effort! Practise again to improve.'}else renderMC()}
function renderType(){current=ti[ii];locked=false;document.getElementById('c2').textContent=`Question ${ii+1} / ${ti.length}`;document.getElementById('s2').textContent=`Score: ${is}`;document.getElementById('b2').style.width=(ii/ti.length*100)+'%';document.getElementById('vimg').src=current.img;document.getElementById('vmeaning').textContent=current.vi;document.getElementById('answer').value='';document.getElementById('answer').disabled=false;document.getElementById('f2').className='feedback hidden';['check','skip'].forEach(id=>document.getElementById(id).classList.remove('hidden'));document.getElementById('n2').classList.add('hidden')}
function checkAnswer(){if(locked)return;let val=document.getElementById('answer').value.trim().toLowerCase().replace(/\s+/g,' ');if(!val)return;locked=true;let ok=val===current.word.toLowerCase();if(ok)is++;document.getElementById('answer').disabled=true;let f=document.getElementById('f2');f.textContent=ok?'Correct! Well done.':`Incorrect. The correct answer is: ${current.word}.`;f.className='feedback '+(ok?'good':'bad');document.getElementById('s2').textContent=`Score: ${is}`;document.getElementById('check').classList.add('hidden');document.getElementById('skip').classList.add('hidden');document.getElementById('n2').classList.remove('hidden')}
function skip(){if(locked)return;locked=true;document.getElementById('answer').disabled=true;let f=document.getElementById('f2');f.textContent=`Skipped. The correct answer is: ${current.word}.`;f.className='feedback bad';document.getElementById('check').classList.add('hidden');document.getElementById('skip').classList.add('hidden');document.getElementById('n2').classList.remove('hidden')}
function nextType(){ii++;if(ii===ti.length){document.getElementById('e2').classList.add('hidden');document.getElementById('r2').classList.remove('hidden');document.getElementById('scoreFinal2').textContent=`${is} / ${ti.length}`;document.getElementById('msg2').textContent=is===ti.length?'Perfect!':'Keep practising. You can do it!'}else renderType()}
restart(1);restart(2);switchMode(1);
</script></body></html>
